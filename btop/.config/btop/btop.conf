#* btop configuration — Pendora (Catppuccin Macchiato)
#* Base defaults come from `btop --default-config` (btop++ >= 1.4); only
#* intentionally-set keys are listed here. Unknown/missing keys fall back
#* to btop's built-in defaults.

#* Theme: resolved from ~/.config/btop/themes/pendora.theme
color_theme = "pendora"
theme_background = true
truecolor = true
rounded_corners = true
force_tty = false
lowcolor = false

#* Refresh interval (ms); >= 100. Slightly livelier than the 2000 default.
update_ms = 1500

#* Boxes shown on startup (cpu mem net proc | gpu0-5)
shown_boxes = "cpu mem net proc"
graph_symbol = "braille"

#* CPU
cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
cpu_sensor = "Auto"
temp_scale = "celsius"
show_coretemp = true
show_cpu_freq = true
clock_format = "%X"

#* Processes
proc_sorting = "cpu lazy"
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true

#* Memory / disks
mem_graphs = true
show_swap = true
show_disks = true
only_physical = true
use_fstab = true

#* Network
net_auto = true
net_sync = true
base_10_bitrate = "Auto"

#* Input / persistence
vim_keys = true
disable_mouse = false
save_config_on_exit = true
